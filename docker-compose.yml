version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: summarizerai-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/faiss_indices:/app/faiss_indices
      - ./backend/logs:/app/logs
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: summarizerai-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

# Enhancement: add restart: unless-stopped for production resilience
# Enhancement: mount uploads volume for persistence across restarts